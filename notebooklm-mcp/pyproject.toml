[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "notebooklm-mcp"
version = "0.1.0"
description = "MCP server for Google NotebookLM via notebooklm-py"
requires-python = ">=3.9"
dependencies = [
    "mcp>=0.1.0",
    "notebooklm>=0.2.0",
    "pydantic>=2.0",
]
